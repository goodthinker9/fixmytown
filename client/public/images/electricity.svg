<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <!-- Power / electricity placeholder -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#2d2000"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" fill="url(#bg)"/>
  <!-- Power pole -->
  <rect x="390" y="80"  width="20" height="400" fill="#1a1500"/>
  <rect x="320" y="140" width="160" height="12" rx="4" fill="#1a1500"/>
  <rect x="340" y="200" width="120" height="10" rx="4" fill="#1a1500"/>
  <!-- Insulators -->
  <circle cx="330" cy="145" r="8" fill="#2a2000"/>
  <circle cx="470" cy="145" r="8" fill="#2a2000"/>
  <circle cx="348" cy="205" r="6" fill="#2a2000"/>
  <circle cx="452" cy="205" r="6" fill="#2a2000"/>
  <!-- Wires -->
  <line x1="0"   y1="160" x2="330" y2="145" stroke="#111" stroke-width="2"/>
  <line x1="470" y1="145" x2="800" y2="130" stroke="#111" stroke-width="2"/>
  <!-- Lightning bolt hint -->
  <polygon points="420,250 400,300 415,300 395,360 430,290 413,290" fill="#fbbf2460"/>
  <text x="400" y="520" text-anchor="middle" font-family="system-ui" font-size="13" fill="#fde68a40">Replace with electricity.jpg</text>
</svg>
