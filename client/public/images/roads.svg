<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <!-- Road / pothole infrastructure placeholder -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="540" fill="url(#bg)"/>
  <!-- Road surface -->
  <rect y="300" width="800" height="240" fill="#222"/>
  <!-- Road lines -->
  <rect x="380" y="310" width="40"  height="60" rx="4" fill="#f59e0b80"/>
  <rect x="380" y="390" width="40"  height="60" rx="4" fill="#f59e0b80"/>
  <rect x="380" y="470" width="40"  height="60" rx="4" fill="#f59e0b80"/>
  <!-- Pothole hint -->
  <ellipse cx="200" cy="380" rx="60" ry="30" fill="#111" stroke="#444" stroke-width="3"/>
  <ellipse cx="200" cy="380" rx="50" ry="22" fill="#0a0a0a"/>
  <!-- Pavement edge -->
  <rect y="295" width="800" height="10" fill="#3a3a3a"/>
  <!-- Sky -->
  <rect width="800" height="300" fill="#1f2937"/>
  <text x="400" y="520" text-anchor="middle" font-family="system-ui" font-size="13" fill="#9ca3af40">Replace with roads.jpg</text>
