  <rect x="60" y="203" width="680" height="34" rx="17" fill="url(#water)" opacity="0.5"/>
  <!-- Droplet shapes -->
  <ellipse cx="400" cy="420" rx="18" ry="22" fill="#93c5fd40"/>
  <ellipse cx="300" cy="440" rx="12" ry="15" fill="#93c5fd30"/>
  <ellipse cx="500" cy="435" rx="15" ry="18" fill="#93c5fd30"/>
